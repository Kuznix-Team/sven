name: Release

# Releases happen automatically when VERSION in sven/constants.py is bumped on main
# (the tag is created for you), or when you push a tag like v2.1.2 by hand
# (`make release VERSION=2.1.2`). To (re)run one manually: Actions -> Release -> Run workflow.
on:
  push:
    branches: [main]
    paths: ['sven/constants.py']   # paths are ignored for tag pushes
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v2.1.2 (default: v<VERSION from constants.py>)'
        required: false

permissions:
  contents: read

# one release at a time; never cancel one that is half-published
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
      ref: ${{ steps.plan.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: scripts/release_plan.sh

  test:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Tag must match the version in the source
        run: |
          WANT="${TAG#v}"
          CONST=$(grep -Po '^VERSION\s*=\s*"\K[^"]+' sven/constants.py)
          PYPROJ=$(grep -Po '^version\s*=\s*"\K[^"]+' pyproject.toml)
          echo "tag=$WANT constants.py=$CONST pyproject.toml=$PYPROJ"
          if [ "$WANT" != "$CONST" ] || [ "$WANT" != "$PYPROJ" ]; then
            echo "::error::Version mismatch: bump sven/constants.py and pyproject.toml to $WANT before tagging"
            exit 1
          fi

      - name: Run tests
        run: |
          pip install requests zstandard python-gnupg pytest
          python -m pytest -q

  build:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    # Build on an older glibc than ubuntu-latest so the binary runs on more systems.
    container: python:3.11-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Install build dependencies
        run: pip install requests zstandard python-gnupg pyinstaller

      - name: Build binary
        run: make build

      - name: Name the asset the way install.sh and the PKGBUILD expect
        run: |
          mv dist/sven dist/sven-linux-x86_64
          cd dist && sha256sum sven-linux-x86_64 > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: sven-linux-x86_64
          path: |
            dist/sven-linux-x86_64
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sven-linux-x86_64
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ needs.prepare.outputs.ref }}   # creates the tag here if it does not exist yet
          generate_release_notes: true
          prerelease: ${{ contains(env.TAG, '-') }}
          files: |
            dist/sven-linux-x86_64
            dist/SHA256SUMS

  aur:
    # Optional: only runs when the AUR_SSH_PRIVATE_KEY secret is configured.
    needs: [prepare, release]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - name: Check for AUR credentials
        id: gate
        run: |
          if [ -n "$AUR_SSH_PRIVATE_KEY" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"
          else echo "AUR_SSH_PRIVATE_KEY not set; skipping AUR publish"; fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          name: sven-linux-x86_64
          path: dist

      - name: Stage PKGBUILD with its local sources and real checksums
        if: steps.gate.outputs.enabled == 'true'
        run: |
          mkdir aur
          cp PKGBUILD aur/
          cp initscripts/*.hook aur/
          cp scripts/check-sven-lock.sh scripts/check-sven-aur-upgrade.sh scripts/delegate-sven-remove.sh aur/
          python3 scripts/stage_aur.py "$TAG" dist/SHA256SUMS aur
          sed -n '1,25p' aur/PKGBUILD

      - name: Publish AUR package (sven-bin)
        if: steps.gate.outputs.enabled == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@v3.0.1
        with:
          pkgname: sven-bin
          pkgbuild: ./aur/PKGBUILD
          assets: ./aur/*
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Release ${{ env.TAG }}"
